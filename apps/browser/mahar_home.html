<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahar Browser</title>
<style>
  :root { --bg:#ffffff; --fg:#1a1a2e; --muted:#6b7280; --card:#f3f4f6;
          --accent1:#1a56db; --accent2:#f59e0b; --input:#ffffff; --border:#e5e7eb; }
  body.dark { --bg:#12121f; --fg:#f3f4f6; --muted:#9ca3af; --card:#1e1e33;
              --input:#1e1e33; --border:#2e2e4d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg);
         font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
         min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; padding:24px;
         transition:background .25s,color .25s; }
  .logo { width:120px; height:120px; border-radius:28px;
          box-shadow:0 10px 30px rgba(0,0,0,.25); }
  h1 { font-size:44px; margin:18px 0 4px; letter-spacing:1px;
       background:linear-gradient(90deg,var(--accent1),var(--accent2));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { color:var(--muted); margin-bottom:28px; font-size:15px; }
  form { width:min(560px,92vw); display:flex; gap:8px; }
  input[type=text] { flex:1; padding:14px 20px; font-size:16px;
      border:2px solid var(--border); border-radius:999px;
      background:var(--input); color:var(--fg); outline:none; }
  input[type=text]:focus { border-color:var(--accent1); }
  button { padding:14px 26px; font-size:16px; border:none; border-radius:999px;
      background:linear-gradient(90deg,var(--accent1),#7c3aed); color:#fff;
      cursor:pointer; font-weight:600; }
  button:hover { filter:brightness(1.1); }
  .links { margin-top:36px; display:flex; gap:14px; flex-wrap:wrap;
           justify-content:center; }
  .links a { text-decoration:none; color:var(--fg); background:var(--card);
      padding:12px 18px; border-radius:14px; font-size:14px;
      border:1px solid var(--border); }
  .links a:hover { border-color:var(--accent1); }
  .foot { position:fixed; bottom:14px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <img class="logo" src="mahar-browser-logo-256.png" alt="Mahar Browser logo">
  <h1>Mahar</h1>
  <div class="tag">Apna browser &mdash; tez, saaf aur private</div>
  <form id="s">
    <input type="text" id="q" placeholder="Search Mahar…" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>
  <div class="links">
    <a href="https://www.youtube.com">YouTube</a>
    <a href="https://www.facebook.com">Facebook</a>
    <a href="https://www.wikipedia.org">Wikipedia</a>
    <a href="https://github.com">GitHub</a>
  </div>
  <div class="foot">Mahar Browser &mdash; made for Mahar OS</div>
<script>
  var p = new URLSearchParams(location.search);
  if (p.get("theme") === "dark") document.body.classList.add("dark");
  var engines = {
    duckduckgo: "https://duckduckgo.com/?q=",
    google:     "https://www.google.com/search?q=",
    bing:       "https://www.bing.com/search?q="
  };
  var tpl = engines[p.get("engine")] || engines.duckduckgo;
  document.getElementById("s").addEventListener("submit", function(e){
    e.preventDefault();
    var q = document.getElementById("q").value.trim();
    if (q) location.href = tpl + encodeURIComponent(q);
  });
</script>
</body>
</html>
