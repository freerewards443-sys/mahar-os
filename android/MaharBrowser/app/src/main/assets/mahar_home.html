<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahar Browser</title>
<style>
  :root { --bg:#ffffff; --fg:#1a1a2e; --muted:#6b7280; --card:#f3f4f6;
          --accent1:#1a56db; --accent2:#f59e0b; --input:#ffffff; --border:#e5e7eb; }
  body.dark { --bg:#12121f; --fg:#f3f4f6; --muted:#9ca3af; --card:#1e1e33;
              --input:#1e1e33; --border:#2e2e4d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,sans-serif;
         min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; padding:24px; }
  .logo { width:104px; height:104px; border-radius:26px;
          box-shadow:0 10px 30px rgba(0,0,0,.25); }
  h1 { font-size:40px; margin:16px 0 4px; letter-spacing:1px;
       background:linear-gradient(90deg,var(--accent1),var(--accent2));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { color:var(--muted); margin-bottom:6px; font-size:15px; text-align:center; }
  .hello { color:var(--fg); margin-bottom:24px; font-size:16px; font-weight:600; }
  form { width:min(560px,94vw); display:flex; gap:8px; }
  input[type=text] { flex:1; padding:14px 18px; font-size:16px; min-width:0;
      border:2px solid var(--border); border-radius:999px;
      background:var(--input); color:var(--fg); outline:none; }
  input[type=text]:focus { border-color:var(--accent1); }
  button { padding:14px 22px; font-size:16px; border:none; border-radius:999px;
      background:linear-gradient(90deg,var(--accent1),#7c3aed); color:#fff;
      font-weight:600; }
  .links { margin-top:30px; display:flex; gap:12px; flex-wrap:wrap;
           justify-content:center; }
  .links a { text-decoration:none; color:var(--fg); background:var(--card);
      padding:12px 16px; border-radius:14px; font-size:14px;
      border:1px solid var(--border); }
  .foot { margin-top:34px; color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>
<body class="{{THEME_CLASS}}">
  <img class="logo" src="mahar_logo.png" alt="Mahar Browser logo">
  <h1>Mahar</h1>
  <div class="tag">Apna browser — tez, saaf aur private</div>
  <div class="hello">Assalam-o-Alaikum, {{PROFILE_NAME}} 👋</div>
  <form id="s">
    <input type="text" id="q" placeholder="Search…" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div class="links">
    <a href="https://www.youtube.com">▶️ YouTube</a>
    <a href="https://www.facebook.com">Facebook</a>
    <a href="https://www.wikipedia.org">Wikipedia</a>
    <a href="https://github.com">GitHub</a>
    <a href="https://dealspakistan.blogspot.com">🛒 Deals Pakistan</a>
    <a href="https://www.youtube.com/@SlowEdits_34">🎬 Slow Edits</a>
  </div>
  <div class="foot">Mahar Browser Android — v4 • Search by {{ENGINE_NAME}}</div>
<script>
  var ENGINE = "{{ENGINE_URL}}";
  document.getElementById("s").addEventListener("submit", function(e){
    e.preventDefault();
    var q = document.getElementById("q").value.trim();
    if (q) location.href = ENGINE.replace("{}", encodeURIComponent(q));
  });
</script>
</body>
</html>
