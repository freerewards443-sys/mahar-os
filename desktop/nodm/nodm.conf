# /etc/default/nodm — Mahar OS autologin configuration
#
# nodm starts an X session automatically at boot for NODM_USER,
# giving the Windows-like "straight to desktop" experience.
# (nodm package must be installed in the live image.)
#
# Real nodm variables: NODM_ENABLED, NODM_USER, NODM_XSESSION,
# NODM_X_OPTIONS, NODM_MIN_SESSION_TIME.

# Enable the nodm init script / service
NODM_ENABLED=true

# User to log in automatically (created by the build script)
NODM_USER=mahar

# Session to start: the IceWM session manager, which also runs
# the /etc/icewm/startup script
NODM_XSESSION=/usr/bin/icewm-session

# X server options
NODM_X_OPTIONS="-nolisten tcp"

# Minimum session length in seconds (prevents respawn loops)
NODM_MIN_SESSION_TIME=60
