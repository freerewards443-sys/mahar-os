# Mahar Browser (Android) — cloud APK build via GitHub Actions (free)
#
# HOW TO USE:
#   GitHub repo -> Actions tab -> "Build Mahar Browser APK"
#   -> "Run workflow" -> ~5-10 min -> Releases se MaharBrowser.apk download karo
#
# Signing: har release APK ek hi permanent Mahar release key se sign hota
# hai (keystore GitHub secret ANDROID_KEYSTORE_BASE64 me hai, kabhi repo
# me commit nahi hota). Is liye v6 se aage ke updates purani app ke upar
# seedha install hote hain — uninstall + dobara download nahi chahiye.
# Release notes me versionCode likha hota hai taake app ka in-app updater
# naya version pehchan sake.

name: Build Mahar Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Read version from build.gradle
        id: version
        run: |
          CODE=$(grep -E 'versionCode = ' android/MaharBrowser/app/build.gradle | grep -oE '[0-9]+' | head -1)
          NAME=$(grep -E 'versionName = ' android/MaharBrowser/app/build.gradle | sed 's/.*"\([^"]*\)".*/\1/' | head -1)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME"

      - name: Build release APK (unsigned)
        run: |
          cd android/MaharBrowser
          gradle assembleRelease --no-daemon

      - name: Sign APK with Mahar release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > mahar-release.p12
          UNSIGNED="android/MaharBrowser/app/build/outputs/apk/release/app-release-unsigned.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -f 4 "$UNSIGNED" MaharBrowser-aligned.apk
          "$BT/apksigner" sign --ks mahar-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --out MaharBrowser.apk MaharBrowser-aligned.apk
          "$BT/apksigner" verify --print-certs MaharBrowser.apk
          rm -f mahar-release.p12 MaharBrowser-aligned.apk
          ls -lh MaharBrowser.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: browser-android-${{ github.run_number }}
          name: "Mahar Browser Android ${{ steps.version.outputs.name }}"
          body: |
            versionCode: ${{ steps.version.outputs.code }}
            Mahar Browser Android ${{ steps.version.outputs.name }} — install over the previous version; profiles and cookies are kept.
          files: MaharBrowser.apk
